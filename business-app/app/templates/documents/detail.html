{% extends "base.html" %}
{% block content %}
{% if doc %}
<div class="bg-white shadow rounded-lg p-8 max-w-3xl mx-auto">
  <span class="text-xs px-2 py-1 bg-slate-100 rounded">{{ doc.category }}</span>
  <h1 class="text-2xl font-bold mt-2 mb-1">{{ doc.title }}</h1>
  <p class="text-xs text-slate-400 mb-4">{{ doc.created_at }}</p>
  <pre class="whitespace-pre-wrap font-sans text-sm">{{ doc.content }}</pre>
</div>
{% else %}
<p class="text-slate-500">Không tìm thấy tài liệu.</p>
{% endif %}
{% endblock %}
