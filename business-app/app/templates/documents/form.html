{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Tài liệu mới</h1>
<form method="post" action="/documents/new" class="bg-white shadow rounded-lg p-6 space-y-4 max-w-3xl">
  <label class="block"><span class="text-sm">Tiêu đề *</span><input name="title" required class="w-full border rounded px-3 py-2" /></label>
  <label class="block"><span class="text-sm">Danh mục</span>
    <select name="category" class="w-full border rounded px-3 py-2">
      <option value="policy">Chính sách</option>
      <option value="sop">Quy trình SOP</option>
      <option value="onboarding">Onboarding</option>
      <option value="general" selected>Chung</option>
    </select>
  </label>
  <label class="block"><span class="text-sm">Nội dung *</span><textarea name="content" rows="12" required class="w-full border rounded px-3 py-2 font-mono text-sm"></textarea></label>
  <div class="flex gap-2">
    <button class="bg-slate-900 text-white px-4 py-2 rounded">Lưu</button>
    <a href="/documents" class="px-4 py-2 rounded border">Huỷ</a>
  </div>
</form>
{% endblock %}
