{% extends "base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-4">
  <h1 class="text-2xl font-bold">Tài liệu nội bộ</h1>
  <a href="/documents/new" class="bg-slate-900 text-white px-4 py-2 rounded">+ Thêm tài liệu</a>
</div>
<form class="mb-4">
  <input name="q" value="{{ q }}" placeholder="Tìm tài liệu..." class="border rounded px-3 py-2 w-64" />
</form>
<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
{% for d in items %}
  <a href="/documents/{{ d.id }}" class="block bg-white shadow rounded-lg p-4 hover:shadow-md">
    <span class="text-xs px-2 py-1 bg-slate-100 rounded">{{ d.category }}</span>
    <h3 class="font-semibold mt-2">{{ d.title }}</h3>
    <p class="text-sm text-slate-500 mt-1 line-clamp-2">{{ d.content[:120] }}…</p>
  </a>
{% else %}
  <p class="text-slate-400">Chưa có tài liệu</p>
{% endfor %}
</div>
{% endblock %}
