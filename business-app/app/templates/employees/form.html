{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Nhân viên mới</h1>
<form method="post" action="/employees/new" class="bg-white shadow rounded-lg p-6 grid grid-cols-2 gap-4 max-w-3xl">
  <label class="block"><span class="text-sm">Mã NV *</span><input name="code" required class="w-full border rounded px-3 py-2" /></label>
  <label class="block"><span class="text-sm">Họ tên *</span><input name="full_name" required class="w-full border rounded px-3 py-2" /></label>
  <label class="block"><span class="text-sm">Vị trí</span><input name="position" class="w-full border rounded px-3 py-2" /></label>
  <label class="block"><span class="text-sm">Phòng ban</span><input name="department" class="w-full border rounded px-3 py-2" /></label>
  <label class="block"><span class="text-sm">Lương cơ bản (VND/tháng)</span><input name="base_salary" type="number" step="0.01" value="10000000" class="w-full border rounded px-3 py-2" /></label>
  <label class="block"><span class="text-sm">Số người phụ thuộc</span><input name="dependents" type="number" value="0" class="w-full border rounded px-3 py-2" /></label>
  <div class="col-span-2 flex gap-2">
    <button class="bg-slate-900 text-white px-4 py-2 rounded">Lưu</button>
    <a href="/employees" class="px-4 py-2 rounded border">Huỷ</a>
  </div>
</form>
{% endblock %}
