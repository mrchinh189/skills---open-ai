{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Đơn hàng mới</h1>
<form method="post" action="/orders/new" class="bg-white shadow rounded-lg p-6 space-y-4">
  <label class="block">
    <span class="text-sm">Khách hàng *</span>
    <select name="customer_id" required class="w-full border rounded px-3 py-2">
      {% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
    </select>
  </label>

  <div>
    <span class="text-sm font-semibold">Sản phẩm</span>
    <table class="w-full text-sm mt-2 border">
      <thead class="bg-slate-50"><tr><th class="p-2 text-left">Sản phẩm</th><th class="text-right">Đơn giá</th><th>VAT</th><th>Số lượng</th></tr></thead>
      <tbody>
      {% for p in products %}
        <tr class="border-t">
          <td class="p-2">
            <input type="hidden" name="product_id" value="{{ p.id }}" />
            <span>{{ p.sku }} — {{ p.name }}</span>
          </td>
          <td class="text-right">{{ p.price|vnd }} ₫</td>
          <td class="text-center">{{ p.vat_rate }}%</td>
          <td class="text-center"><input name="quantity" type="number" value="0" min="0" class="border rounded w-20 px-2 py-1 text-center" /></td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>

  <label class="block">
    <span class="text-sm">Ghi chú</span>
    <textarea name="note" rows="2" class="w-full border rounded px-3 py-2"></textarea>
  </label>

  <div class="flex gap-2">
    <button class="bg-slate-900 text-white px-4 py-2 rounded">Tạo đơn</button>
    <a href="/orders" class="px-4 py-2 rounded border">Huỷ</a>
  </div>
</form>
{% endblock %}
