{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Sản phẩm mới</h1>
<form method="post" action="/products/new" class="bg-white shadow rounded-lg p-6 grid grid-cols-2 gap-4 max-w-2xl">
  <label class="block"><span class="text-sm">SKU *</span><input name="sku" required class="w-full border rounded px-3 py-2" /></label>
  <label class="block"><span class="text-sm">Tên *</span><input name="name" required class="w-full border rounded px-3 py-2" /></label>
  <label class="block"><span class="text-sm">ĐVT</span><input name="unit" value="cái" class="w-full border rounded px-3 py-2" /></label>
  <label class="block"><span class="text-sm">Giá (VND)</span><input name="price" type="number" step="0.01" value="0" class="w-full border rounded px-3 py-2" /></label>
  <label class="block"><span class="text-sm">VAT (%)</span>
    <select name="vat_rate" class="w-full border rounded px-3 py-2">
      <option value="0">0%</option><option value="5">5%</option>
      <option value="8">8%</option><option value="10" selected>10%</option>
    </select>
  </label>
  <label class="block"><span class="text-sm">Tồn kho</span><input name="stock" type="number" value="0" class="w-full border rounded px-3 py-2" /></label>
  <div class="col-span-2 flex gap-2">
    <button class="bg-slate-900 text-white px-4 py-2 rounded">Lưu</button>
    <a href="/products" class="px-4 py-2 rounded border">Huỷ</a>
  </div>
</form>
{% endblock %}
