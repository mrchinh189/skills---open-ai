{% extends "base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-4">
  <h1 class="text-2xl font-bold">Sản phẩm</h1>
  <a href="/products/new" class="bg-slate-900 text-white px-4 py-2 rounded">+ Thêm sản phẩm</a>
</div>
<div class="bg-white rounded-lg shadow overflow-x-auto">
<table class="w-full text-sm">
  <thead class="bg-slate-50 text-left text-slate-600">
    <tr><th class="p-3">SKU</th><th>Tên</th><th>ĐVT</th><th class="text-right">Giá</th><th class="text-right">VAT</th><th class="text-right">Tồn kho</th></tr>
  </thead>
  <tbody>
  {% for p in items %}
    <tr class="border-t">
      <td class="p-3 font-mono">{{ p.sku }}</td>
      <td>{{ p.name }}</td>
      <td>{{ p.unit }}</td>
      <td class="text-right">{{ p.price|vnd }} ₫</td>
      <td class="text-right">{{ p.vat_rate }}%</td>
      <td class="text-right">{{ p.stock }}</td>
    </tr>
  {% else %}
    <tr><td colspan="6" class="p-6 text-center text-slate-400">Chưa có sản phẩm</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
